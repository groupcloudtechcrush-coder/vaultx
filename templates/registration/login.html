{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VaultX — Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Space Grotesk', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .btn-orange {
      background: linear-gradient(135deg, #f97316, #ea580c);
      box-shadow: 0 4px 20px rgba(249,115,22,0.4);
      transition: all 0.2s ease;
    }
    .btn-orange:hover {
      background: linear-gradient(135deg, #fb923c, #f97316);
      box-shadow: 0 6px 28px rgba(249,115,22,0.55);
      transform: translateY(-1px);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.5s ease forwards; }
    .delay-1 { animation-delay: 0.1s; opacity: 0; }
    .delay-2 { animation-delay: 0.2s; opacity: 0; }
    .delay-3 { animation-delay: 0.3s; opacity: 0; }
    .delay-4 { animation-delay: 0.4s; opacity: 0; }

    /* Animated background grid */
    .bg-grid {
      background-image:
        linear-gradient(rgba(249,115,22,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(249,115,22,0.04) 1px, transparent 1px);
      background-size: 48px 48px;
    }
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }
    .glow-orb { animation: pulse-glow 4s ease-in-out infinite; }
    .input-field {
      background: rgba(30,41,59,0.8);
      border: 1px solid rgba(100,116,139,0.4);
      color: white;
      transition: all 0.2s ease;
    }
    .input-field:focus {
      outline: none;
      border-color: #f97316;
      box-shadow: 0 0 0 3px rgba(249,115,22,0.15);
      background: rgba(30,41,59,1);
    }
    .input-field::placeholder { color: #475569; }
    .glass-card {
      background: rgba(15,23,42,0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(249,115,22,0.12);
    }
  </style>
</head>
<body class="bg-slate-950 h-full flex items-center justify-center relative overflow-hidden bg-grid">

  <!-- Decorative glow orbs -->
  <div class="glow-orb absolute top-[-120px] right-[-80px] w-[480px] h-[480px] rounded-full pointer-events-none"
       style="background: radial-gradient(circle, rgba(249,115,22,0.15) 0%, transparent 70%)"></div>
  <div class="glow-orb absolute bottom-[-100px] left-[-60px] w-[380px] h-[380px] rounded-full pointer-events-none"
       style="background: radial-gradient(circle, rgba(234,88,12,0.10) 0%, transparent 70%); animation-delay:2s"></div>

  <!-- Card -->
  <div class="glass-card rounded-3xl p-8 w-full max-w-sm mx-4 shadow-2xl relative z-10">

    <!-- Logo -->
    <div class="fade-up flex flex-col items-center mb-8">
      <div class="w-14 h-14 btn-orange rounded-2xl flex items-center justify-center mb-4 shadow-lg">
        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-extrabold text-white tracking-tight">
        Vault<span class="text-orange-500">X</span>
      </h1>
      <p class="text-slate-400 text-sm mt-1">Secure password manager</p>
    </div>

    <!-- Error messages -->
    {% if form.errors %}
    <div class="fade-up delay-1 mb-5 bg-red-900/30 border border-red-700/50 rounded-xl px-4 py-3 flex gap-3 items-start">
      <svg class="w-4 h-4 text-red-400 mt-0.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
      </svg>
      <p class="text-red-300 text-sm">Invalid username or password. Please try again.</p>
    </div>
    {% endif %}

    <!-- Form -->
    <form method="post" class="space-y-4">
      {% csrf_token %}

      <div class="fade-up delay-1">
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Username</label>
        <input type="text" name="username" autocomplete="username" required
          class="input-field w-full rounded-xl px-4 py-3 text-sm"
          placeholder="Enter your username" />
      </div>

      <div class="fade-up delay-2">
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Password</label>
        <div class="relative">
          <input type="password" name="password" id="login-pw" autocomplete="current-password" required
            class="input-field w-full rounded-xl px-4 py-3 pr-12 text-sm"
            placeholder="Enter your password" />
          <button type="button" onclick="togglePw('login-pw')"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-orange-400 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="fade-up delay-3 pt-2">
        <button type="submit" class="btn-orange w-full text-white rounded-xl py-3.5 font-bold text-sm tracking-wide">
          Unlock Vault
        </button>
      </div>
    </form>

    <!-- Divider -->
    <div class="fade-up delay-4 flex items-center gap-3 my-6">
      <div class="flex-1 h-px bg-slate-800"></div>
      <span class="text-slate-600 text-xs">New to VaultX?</span>
      <div class="flex-1 h-px bg-slate-800"></div>
    </div>

    <div class="fade-up delay-4">
      <a href="{% url 'register' %}"
        class="block w-full text-center border border-orange-500/40 text-orange-400 hover:bg-orange-500/10 rounded-xl py-3 text-sm font-semibold transition-all">
        Create an Account
      </a>
    </div>

    <!-- Security badge -->
    <div class="fade-up delay-4 mt-6 flex items-center justify-center gap-2 text-slate-600">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
      </svg>
      <span class="text-xs mono">Fernet AES-128-CBC · PBKDF2 · HMAC-SHA256</span>
    </div>
  </div>

  <script>
    function togglePw(id) {
      const inp = document.getElementById(id);
      inp.type = inp.type === 'password' ? 'text' : 'password';
    }
  </script>
</body>
</html>
