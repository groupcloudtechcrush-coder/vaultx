name: CI/CD Deploy to Amazon ECR

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Login, Build, and Push to ECR
      env:
        AWS_DEFAULT_REGION: us-east-1
        AWS_REGION: us-east-1
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_ACCOUNT_ID: "0570-2915-8877"
        ECR_REPO_NAME: "monietrix/vaultx"
      run: |
        aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_://amazonaws.com
        
        docker build -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_://amazonaws.com/$ECR_REPO_NAME:latest .
        
        docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_://amazonaws.com/$ECR_REPO_NAME:latest



        
    
