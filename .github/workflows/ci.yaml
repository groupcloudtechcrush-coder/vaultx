name: Deploy Web App to Amazon ECR

on:
  push:
    branches: [ "main" ] # Triggers the pipeline automatically on every push to main

jobs:
  build-and-push:
    name: Build Image and Push to AWS ECR
    runs-on: ubuntu-latest

    steps:
    # Step 1: Download the application source code from Git
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Log into AWS using the repository secrets
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    # Step 3: Get token authorization to push directly to ECR
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # Step 4: Build, tag, and publish the container image
    - name: Build, Tag, and Push Docker Image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: vaultx-prod1 # Replace with your ECR repo name
        IMAGE_TAG: ${{ github.sha }} # Uses the unique Git commit ID as the version tag
      run: |
        # Build the Docker image locally on the runner
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
        
        # Push both the unique commit version and the 'latest' pointer to AWS
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest




        
    
