name: CI/CD Deploy to Amazon ECR

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Login, Build, and Push to ECR
      env:
        AWS_DEFAULT_REGION: us-east-1
        AWS_REGION: us-east-1
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        ECR_REPO_NAME: ${{ secrets.ECR_REPO_NAME }}
      run: |
        # 1. Log in to AWS using the dynamic secrets format
        aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
        
        # 2. Build your local Docker image using variables instead of hardcoded strings
        docker build -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_://amazonaws.com .
        
        # 3. Push the finalized image to AWS ECR
        docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_://amazonaws.com




        
    
