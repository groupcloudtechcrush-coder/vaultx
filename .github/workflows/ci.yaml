name: CI/CD Deploy to Amazon ECR

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Login, Build, and Push to ECR
      env:
        AWS_DEFAULT_REGION: us-east-1
        AWS_REGION: us-east-1
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_ACCOUNT_ID:  ${{ secrets.AWS_ACCOUNT_ID }}
        ECR_REPO_NAME: ${{ secrets.ECR_REPO_NAME }}
      run: |
        # 1. Authentic AWS with no variable syntax bugs
        aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 057029158877.dkr.ecr.us-east-1.amazonaws.com
        
        # 2. Build the Docker image (⚠️ Change 'my-application' to your real ECR repo name)
        docker build -t ://amazonaws.com .
        
        # 3. Push the image up to AWS
        docker push ://amazonaws.com



        
    
